{{- if and .Values.tls.selfSigned (not .Values.tls.existingSecret) }}
{{- $name := include "outbound-smtp.tlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "outbound-smtp.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  {{- /* keep the certificate stable across upgrades */}}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $cert := genSelfSignedCert .Values.config.hostname nil (list .Values.config.hostname) 365 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
